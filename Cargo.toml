[package]
# The registry name, because `almanac` is taken on crates.io, PyPI and
# npm alike. The binary keeps the typed name; see [[bin]] below.
name = "lmnc"
version = "0.2.0"
edition = "2024"
description = "Almanac curates agent skills and indexes them for agents to read"
license = "MIT"
repository = "https://github.com/cjohnhanson/almanac"
homepage = "https://github.com/cjohnhanson/almanac"
readme = "README.md"
authors = ["Cody Hanson"]
keywords = ["agent", "skills", "mcp", "ai", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Repository machinery belongs on GitHub. A consumer installing the
# crate gets the source, the license, and the README.
exclude = [
    # The npm wrapper and its generator are release machinery. The
    # generated platform packages each hold a built binary, and one of
    # those reached a crate before this line existed.
    "npm/",
    # Drives npm/, dropped above, so it cannot run from the tarball.
    "tests/npm_wrapper_platforms.rs",
    ".tisket/",
    "tisket.yml",
    ".zettel/",
    "zettel.yml",
    ".gaff/",
    ".github/",
    ".agents/",
    "scripts/",
    # Shells out to scripts/merge-gate.sh, which the line above drops.
    "tests/merge_gate_guard.rs",
    "tests/missouri/",
    "CONTRIBUTING.md",
    "AGENTS.md",
    ".editorconfig",
    "rust-toolchain.toml",
]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"


# Two names, one build. `almanac` is what a person types. `lmnc` exists
# because the registries that matter for `uvx` and `npx` needed a free
# name, and maturin ties the installed command to the Cargo bin name.
# The registry name differs from the name this crate's own source
# imports. The lib keeps the imported name, so no `use` changes.
[lib]
name = "almanac"

[[bin]]
name = "almanac"
path = "src/main.rs"

[[bin]]
name = "lmnc"
path = "src/bin/lmnc.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
mdstore = { git = "https://github.com/cjohnhanson/mdstore", rev = "ea739c4", features = ["mcp"] }
dirs = "6"
thiserror = "2"
sigpipe = "0.1.3"
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal", "net"] }
axum = "0.8"
sha2 = "0.11.0"
unicode-normalization = "0.1.25"
# Unified diffs for `update`, in-process. Nothing here shells out to git.
similar = "2"
# Fetch a pinned commit from a source in-process: https over gix's
# reqwest transport, a local repository by reading its objects. No git
# process runs.
gix = { version = "0.86", default-features = false, features = [
    "revision",
    "sha1",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
] }

diataxis = { version = "0.1", default-features = false, features = ["cli"] }
[dev-dependencies]
tempfile = "3.26.0"

# The docs pages are generated at build time from the same
# documentation set the `docs` subcommand reads.
[build-dependencies]
diataxis = { version = "0.1", default-features = false, features = ["build"] }

# `cargo deb` reads this. It produces target/debian/*.deb, which the
# release attaches to the GitHub release. Installing that file is
# `dpkg -i`, and it is not an apt repository: `apt-get install almanac`
# needs a hosted, signed repository that does not exist yet.
[package.metadata.deb]
maintainer = "cjohnhanson <cody@codyjhanson.com>"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = "Almanac curates agent skills and indexes them for agents to read"
assets = [
    ["target/release/almanac", "usr/bin/", "755"],
    # The short name ships too, so the rule holds on apt: install under
    # one name and both commands work.
    ["target/release/lmnc", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/almanac/README", "644"],
    ["LICENSE", "usr/share/doc/almanac/LICENSE", "644"],
]
