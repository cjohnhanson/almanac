[package]
name = "almanac"
version = "0.2.0"
edition = "2024"
description = "Almanac curates agent skills and indexes them for agents to read"
license = "MIT"
repository = "https://github.com/cjohnhanson/almanac"
homepage = "https://github.com/cjohnhanson/almanac"
readme = "README.md"
authors = ["Cody Hanson"]
keywords = ["agent", "skills", "ai", "cli"]
categories = ["command-line-utilities"]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
mdstore = { git = "https://github.com/cjohnhanson/mdstore", rev = "ddfeb05", features = ["mcp"] }
dirs = "6"
thiserror = "2"
sigpipe = "0.1.3"
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal", "net"] }
axum = "0.8"
sha2 = "0.11.0"
unicode-normalization = "0.1.25"

[dev-dependencies]
tempfile = "3.26.0"
