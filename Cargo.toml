[package]
name = "almanac"
version = "0.2.0"
edition = "2024"
description = "Almanac curates agent skills and indexes them for agents to read"
license = "MIT"
repository = "https://github.com/cjohnhanson/almanac"
homepage = "https://github.com/cjohnhanson/almanac"
readme = "README.md"
authors = ["Cody Hanson"]
keywords = ["agent", "skills", "mcp", "ai", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Repository machinery belongs on GitHub. A consumer installing the
# crate gets the source, the license, and the README.
exclude = [
    ".tisket/",
    "tisket.yml",
    ".zettel/",
    "zettel.yml",
    ".gaff/",
    ".github/",
    ".agents/",
    "scripts/",
    "tests/missouri/",
    "CONTRIBUTING.md",
    "AGENTS.md",
    ".editorconfig",
    "rust-toolchain.toml",
]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"


[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
# The registry name is mdstore-core; `package` keeps the import path
# as `mdstore`, so no source in this crate changes. A path override
# for local work belongs in .cargo/config.toml, never here.
mdstore = { version = "0.3", package = "mdstore-core", features = ["mcp"] }
dirs = "6"
thiserror = "2"
sigpipe = "0.1.3"
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal", "net"] }
axum = "0.8"
sha2 = "0.11.0"
unicode-normalization = "0.1.25"
# Unified diffs for `update`, in-process. Nothing here shells out to git.
similar = "2"
# Fetch a pinned commit from a source in-process: https over gix's
# reqwest transport, a local repository by reading its objects. No git
# process runs.
gix = { version = "0.86", default-features = false, features = [
    "revision",
    "sha1",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
] }

[dev-dependencies]
tempfile = "3.26.0"
