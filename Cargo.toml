[package]
name = "almanac"
version = "0.2.0"
edition = "2024"
description = "Agent skill aggregator — index and retrieve SKILL.md from pluggable sources"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
dirs = "6"
thiserror = "2"
sigpipe = "0.1.3"

[dev-dependencies]
tempfile = "3.26.0"
