env:
  NO_COLOR: "1"
  GIT_CONFIG_GLOBAL: "/dev/null"
  GIT_CONFIG_SYSTEM: "/dev/null"
  GIT_AUTHOR_NAME: "test"
  GIT_AUTHOR_EMAIL: "t@t"
  GIT_COMMITTER_NAME: "test"
  GIT_COMMITTER_EMAIL: "t@t"
  GIT_AUTHOR_DATE: "1600000000 +0000"
  GIT_COMMITTER_DATE: "1600000000 +0000"
setup:
  - name: "build almanac"
    command: "cargo build --quiet --manifest-path ../../Cargo.toml"
  # A wrapper, not a symlink: it pins --user-config to a path that
  # never exists, so the machine's real ~/.config/mdstore/config.yml
  # cannot leak a root-library fallback into the suite. The flag's last
  # occurrence wins, so a test that needs a config passes its own.
  - name: "wrap binary"
    command: |
      mkdir -p .missouri/bin &&
      cp ../../target/debug/almanac .missouri/bin/almanac-bin &&
      printf '#!/bin/sh\nexec "$(dirname "$0")/almanac-bin" --user-config /nonexistent-missouri-user-config.yml "$@"\n' > .missouri/bin/almanac &&
      chmod +x .missouri/bin/almanac .missouri/bin/almanac-bin
packages:
  - jq
