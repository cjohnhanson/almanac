transitions:
  - name: "create skill fixtures"
    command: |
      mkdir -p skills/test-skill/references skills/plain-skill
      printf '%s\n' '---' 'name: test-skill' 'description: A test skill with references for missouri testing.' '---' '' '# Test Skill' '' 'This skill has references for progressive disclosure.' > skills/test-skill/SKILL.md
      printf '%s\n' '# Deep Dive' '' 'Detailed framework explanation that would be too long for SKILL.md.' '' '## Section 1' '' 'Content that agents load on demand.' > skills/test-skill/references/deep-dive.md
      printf '%s\n' '# Examples' '' 'Concrete examples for the test skill.' > skills/test-skill/references/examples.md
      printf '%s\n' '---' 'name: plain-skill' 'description: A skill without references.' '---' '' '# Plain Skill' '' 'No references directory here.' > skills/plain-skill/SKILL.md
    target: "../has-skill-with-refs"

  # Two libraries: this one and a declared one. They hold a name in
  # common, so precedence decides which skill a command loads.
  - name: "declare a second library"
    command: |
      mkdir -p shared/skills/writing shared/skills/testing local/writing local/reviewing
      printf -- '---\nname: writing\ndescription: Shared writing guidance.\n---\n\n# Writing (shared)\n' > shared/skills/writing/SKILL.md
      printf -- '---\nname: testing\ndescription: Shared testing guidance.\n---\n\n# Testing\n' > shared/skills/testing/SKILL.md
      printf -- '---\nname: writing\ndescription: My writing guidance.\n---\n\n# Writing (mine)\n' > local/writing/SKILL.md
      printf -- '---\nname: reviewing\ndescription: My review process.\nrequires:\n  - shared:testing\n  - writing\n---\n\n# Reviewing\n' > local/reviewing/SKILL.md
      printf 'library: skills\nskills: []\n' > shared/almanac.yml
      printf 'library: local\nskills: []\n' > almanac.yml
      printf 'format: 2\nstores:\n  - alias: shared\n    path: ./shared\n' > stores.yml
    target: "../composed"
